<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #111827;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .host { font-size: 12px; color: #6b7280; word-break: break-all; margin-bottom: 12px; }
      label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      p { font-size: 12px; color: #6b7280; margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <h1>Easy Copy</h1>
    <div class="host" id="host">Loading…</div>
    <label>
      <input type="checkbox" id="toggle" />
      Enable on this site
    </label>
    <p>Turns on text selection, right-click copy, a floating Copy button for selections, and a copy icon next to paragraphs.</p>
    <script src="popup.js"></script>
  </body>
</html>
